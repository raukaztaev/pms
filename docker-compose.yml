services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gomp
      POSTGRES_USER: gomp
      POSTGRES_PASSWORD: gomp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomp -d gomp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gomp
      SPRING_DATASOURCE_USERNAME: gomp
      SPRING_DATASOURCE_PASSWORD: gomp
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me
